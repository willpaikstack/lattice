  <g transform="translate(288 22)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="12" font-size="12" font-weight="700" letter-spacing="6" fill="#8C8C8C">VENDOR RESOURCES</text>
    <text x="0" y="82" font-size="64" font-weight="700" fill="#202020">Vendor Equipment</text>
    <text x="0" y="129" font-size="15" fill="#696F78">Browse the machines, inspection tools, and fabrication equipment behind Lattice vendor capacity. Use the section</text>
    <text x="0" y="157" font-size="15" fill="#696F78">filters to narrow by process, tolerance, work envelope, and production role before routing an RFQ.</text>

