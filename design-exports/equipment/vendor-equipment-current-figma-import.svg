    <rect x="965" y="530" width="431" height="76" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="985" y="554" font-size="12" font-weight="700" fill="#9A3412">COMMENT 4</text>
    <text x="985" y="573" font-size="12" fill="#7C2D12">Filters are functional but need better hierarchy,</text>
    <text x="985" y="590" font-size="12" fill="#7C2D12">density, and polished control styling.</text>

