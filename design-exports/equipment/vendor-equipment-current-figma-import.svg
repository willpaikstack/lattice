    <text x="1110" y="61" font-size="12" fill="#7C2D12">Header is clear but could feel more premium.</text>

    <rect x="1046" y="326" width="350" height="76" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="1066" y="350" font-size="12" font-weight="700" fill="#9A3412">COMMENT 3</text>
    <text x="1066" y="369" font-size="12" fill="#7C2D12">Add category navigation so users can jump</text>
