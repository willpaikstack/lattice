<svg width="1463" height="1505" viewBox="0 0 1463 1505" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1463" height="1505" fill="#F7F7F6"/>
  <rect width="240" height="1505" fill="#FFFFFF"/>
  <rect x="12" y="20" width="48" height="48" rx="8" fill="#2F3037"/>
  <text x="36" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">◇</text>
  <rect x="12" y="116" width="134" height="31" rx="4" fill="#8D8D8D"/>
  <text x="79" y="136" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#111111">Request Quote</text>

  <text x="12" y="174" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#111111">WORKSPACE</text>
  <text x="60" y="211" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Home</text>
  <text x="60" y="256" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Request Quote</text>
  <text x="60" y="300" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Quotes</text>
  <text x="60" y="345" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Orders</text>
  <line x1="12" y1="380" x2="228" y2="380" stroke="#EEEEEE"/>

  <text x="12" y="412" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#111111">YOUR RESOURCES</text>
  <text x="60" y="450" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Materials</text>
  <text x="60" y="494" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Capabilities</text>
  <text x="60" y="539" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Equipment</text>

  <rect x="12" y="1367" width="216" height="56" rx="4" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="64" y="1390" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111111">Admin</text>
  <text x="64" y="1410" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7C7F85">Open internal controls.</text>
  <circle cx="30" cy="1469" r="18" fill="#2F3037"/>
  <text x="30" y="1475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">WP</text>
  <text x="60" y="1465" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111111">William Paik</text>
  <text x="60" y="1483" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7C7F85">william.paik@amogy...</text>

  <g transform="translate(288 20)">
    <rect width="1128" height="143" rx="32" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="26" y="40" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="7" fill="#96A0AD">RESOURCES</text>
    <text x="26" y="109" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" fill="#030717">Fabrication Capabilities</text>
  </g>

  <g transform="translate(288 194)">
    <rect width="1128" height="397" rx="32" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="26" y="52" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#050914">Fabrication Capabilities</text>
    <text x="26" y="92" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">Lattice connects domestic fabrication demand with a vetted network of high-performance manufacturing partners. Our current capabilities</text>
    <text x="26" y="121" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">focus on precision CNC machining, supported by modern 3-axis, 4-axis, and 5-axis equipment across stainless, aluminum, alloy steels,</text>
    <text x="26" y="150" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">titanium, and nickel alloys.</text>
    <text x="26" y="222" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">Each partner facility is selected based on demonstrated quality systems, equipment depth, tolerance control, and production scalability —</text>
    <text x="26" y="251" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">not just capacity availability.</text>
    <text x="26" y="322" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">All production workflows are supported by documented inspection processes, material traceability, and specification-driven execution to</text>
    <text x="26" y="351" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4B5563">meet ASTM, ASME, and industry-specific standards.</text>
    <rect x="26" y="326" width="126" height="45" rx="16" fill="#0B0B0C"/>
    <text x="89" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Start an RFQ</text>
  </g>

  <g transform="translate(288 622)">
    <rect width="1128" height="251" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="21" y="40" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">CNC milling</text>
    <text x="21" y="73" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4B5563">Precision CNC milling supported by modern 3-axis, 4-axis, and 5-axis equipment for prototype through production work.</text>
    <line x1="0" y1="103" x2="1128" y2="103" stroke="#F0F0F0"/>
    <text x="21" y="134" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4B5563">Use this capability for prismatic machined components, brackets, plates, housings, and complex industrial parts requiring tolerance control and repeatable setup</text>
    <text x="21" y="157" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4B5563">discipline.</text>
    <text x="21" y="193" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#9AA3AE">COMMON GRADES / MODES</text>
    <text x="570" y="193" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#9AA3AE">STANDARDS / DOCUMENTATION</text>
    <rect x="21" y="205" width="58" height="26" rx="13" fill="#F1F5F9"/>
    <text x="50" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F172A">3-axis</text>
    <rect x="88" y="205" width="58" height="26" rx="13" fill="#F1F5F9"/>
    <text x="117" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F172A">4-axis</text>
    <rect x="155" y="205" width="58" height="26" rx="13" fill="#F1F5F9"/>
    <text x="184" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0F172A">5-axis</text>
    <rect x="570" y="205" width="110" height="26" rx="13" fill="#EFF6FF"/>
    <text x="625" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#123A63">Inspection plan</text>
    <rect x="690" y="205" width="118" height="26" rx="13" fill="#EFF6FF"/>
    <text x="749" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#123A63">Tolerance review</text>
    <rect x="818" y="205" width="143" height="26" rx="13" fill="#EFF6FF"/>
    <text x="889" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#123A63">Material traceability</text>
    <text x="1099" y="40" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8A949E">⌃</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(288 888)">
      <rect width="1128" height="102" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="21" y="40" font-size="20" font-weight="700" fill="#111827">CNC turning / mill-turn</text>
      <text x="21" y="73" font-size="14" fill="#4B5563">Turning and mill-turn capacity for round, shaft-like, threaded, or rotational components that need precise concentricity and finish control.</text>
      <text x="1098" y="50" font-size="18" fill="#8A949E">⌄</text>
    </g>
    <g transform="translate(288 1006)">
      <rect width="1128" height="102" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="21" y="40" font-size="20" font-weight="700" fill="#111827">Precision inspection</text>
      <text x="21" y="73" font-size="14" fill="#4B5563">Documented inspection workflows for tolerance-critical manufacturing, including first article and dimensional verification needs.</text>
      <text x="1098" y="50" font-size="18" fill="#8A949E">⌄</text>
    </g>
    <g transform="translate(288 1124)">
      <rect width="1128" height="102" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="21" y="40" font-size="20" font-weight="700" fill="#111827">Material traceability</text>
      <text x="21" y="73" font-size="14" fill="#4B5563">Material certification, mill documentation, and specification-driven sourcing for industrial work where compliance matters.</text>
      <text x="1098" y="50" font-size="18" fill="#8A949E">⌄</text>
    </g>
    <g transform="translate(288 1242)">
      <rect width="1128" height="102" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="21" y="40" font-size="20" font-weight="700" fill="#111827">Production scaling</text>
      <text x="21" y="73" font-size="14" fill="#4B5563">Supplier selection based on equipment depth, quality systems, and production scalability rather than capacity availability alone.</text>
      <text x="1098" y="50" font-size="18" fill="#8A949E">⌄</text>
    </g>
    <g transform="translate(288 1360)">
      <rect width="1128" height="126" rx="16" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="21" y="40" font-size="20" font-weight="700" fill="#111827">Supplier network coordination</text>
      <text x="21" y="73" font-size="14" fill="#4B5563">Coordinated RFQ routing across vetted domestic manufacturing partners so buyers can access the right capability without managing every supplier interaction</text>
      <text x="21" y="96" font-size="14" fill="#4B5563">themselves.</text>
      <text x="1098" y="50" font-size="18" fill="#8A949E">⌄</text>
    </g>
  </g>
</svg>
