<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="456" viewBox="0 0 1280 456">
  <rect width="1280" height="456" fill="#f8f7f4"/>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
  <style>
    .label{font:600 24px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#334155;}
    .value{font:500 26px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#020617;}
    .small{font:500 15px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#64748b;}
    .tiny{font:700 12px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#7a7f87; letter-spacing:2px;}
    .option{font:500 24px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#020617;}
    .heading{font:700 34px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#171717;}
    .body{font:500 18px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#5f6670;}
  </style>
  <text class="tiny" x="80" y="62">CURRENT NATIVE DROPDOWN STATE</text>
<text class="heading" x="80" y="104">General Tolerances open menu</text>

    <text class="label" x="80" y="132">General Tolerances</text>
    <rect x="80" y="158" width="1120" height="82" rx="14" fill="#fff" stroke="#1d73ff" stroke-width="3"/>
    <rect x="70" y="148" width="1140" height="102" rx="22" fill="none" stroke="#bfdbfe" stroke-width="9" opacity="0.9"/>
    <text class="value" x="118" y="210">ISO 2768 Medium (m)</text>
    <path d="M1156 194l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<g filter="url(#shadow)">
<rect x="80" y="240" width="1120" height="104" fill="#fff" stroke="#171717" stroke-width="2"/>
<rect x="82" y="241" width="1116" height="52" fill="#aed2f8"/>
<text class="option" x="118" y="274">ISO 2768 Medium (m)</text>
<text class="option" x="118" y="326">ISO 2768 Fine (f)</text>
</g>
<text class="body" x="80" y="384">Design target: replace harsh native menu border and default blue highlight with a custom, polished floating dropdown.</text>
</svg>