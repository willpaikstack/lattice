<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960">
  <rect width="1400" height="960" fill="#f8f7f4"/>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
  </filter>
  <style>
    .label{font:600 24px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#334155;}
    .value{font:500 26px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#020617;}
    .small{font:500 15px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#64748b;}
    .tiny{font:700 12px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#7a7f87; letter-spacing:2px;}
    .option{font:500 24px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#020617;}
    .heading{font:700 34px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#171717;}
    .body{font:500 18px Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#5f6670;}
  </style>
  <text class="tiny" x="70" y="70">CURRENT REQUEST QUOTE PAGE</text>
<text class="heading" x="70" y="112">Closed dropdown states</text>
<text class="body" x="70" y="146">Current native select controls captured for Figma AI context. The redesign should preserve density and improve menu polish.</text>
<rect x="54" y="190" width="1292" height="704" rx="18" fill="#fff" stroke="#e4e8ee"/>

    <text class="label" x="100" y="260">Material</text>
    <rect x="100" y="286" width="520" height="82" rx="14" fill="#fff" stroke="#1d73ff" stroke-width="3"/>
    <rect x="90" y="276" width="540" height="102" rx="22" fill="none" stroke="#bfdbfe" stroke-width="9" opacity="0.9"/>
    <text class="value" x="138" y="338">SS 304</text>
    <path d="M576 322l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<text class="small" x="100" y="398">Short list, but material families should eventually scale to searchable grouped options.</text>

    <text class="label" x="710" y="260">Surface Finish</text>
    <rect x="710" y="286" width="520" height="82" rx="14" fill="#fff" stroke="#dce4ee" stroke-width="2"/>
    
    <text class="value" x="748" y="338">As machined (Ra 3.2 um / Ra 126 uin)</text>
    <path d="M1186 322l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<text class="small" x="710" y="398">Long manufacturing list; should support scrolling and maybe search/typeahead.</text>

    <text class="label" x="100" y="450">General Tolerances</text>
    <rect x="100" y="476" width="520" height="82" rx="14" fill="#fff" stroke="#dce4ee" stroke-width="2"/>
    
    <text class="value" x="138" y="528">ISO 2768 Medium (m)</text>
    <path d="M576 512l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<text class="small" x="100" y="588">Small but important engineering choice; selected state should be unmistakable.</text>

    <text class="label" x="710" y="450">Manufacturing process</text>
    <rect x="710" y="476" width="520" height="82" rx="14" fill="#fff" stroke="#dce4ee" stroke-width="2"/>
    
    <text class="value" x="748" y="528">CNC Milling</text>
    <path d="M1186 512l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<text class="small" x="710" y="588">This controls routing and supplier fit. Consider grouped process descriptions.</text>

    <text class="label" x="100" y="640">Quality documentation</text>
    <rect x="100" y="666" width="520" height="82" rx="14" fill="#fff" stroke="#dce4ee" stroke-width="2"/>
    
    <text class="value" x="138" y="718">Standard Inspection</text>
    <path d="M576 702l12 12 12-12" fill="none" stroke="#020617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
<text class="small" x="100" y="778">This is procurement-critical. Secondary descriptions could help buyers choose.</text>
</svg>